<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f4fa">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Exam Sprint">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Exam Sprint</title>
<style>
@font-face{font-family:"Atkinson Hyperlegible";src:url(fonts/atkinson-hyperlegible-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url(fonts/jetbrains-mono-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Bricolage Grotesque";src:url(fonts/bricolage-grotesque-latin-wght-normal.woff2) format("woff2");font-weight:200 800;font-display:swap}

/* Layout: one-column phone app (max 560px), sticky top bar, fixed bottom tab bar; every screen is a stack of full-width blocks. */
:root{
 --bg:#f3f4fa; --surface:#ffffff; --surface2:#e9ebf5; --ink:#141932; --muted:#566086; --line:#d9dcec;
 --accent:#f0532d; --accent-ink:#ffffff; --accent-soft:#ffe6de;
 --good:#0b9a72; --good-bg:#dff5ec; --bad:#d8303f; --bad-bg:#fde6e8; --gold:#c98a00; --gold-bg:#fff2cf; --info:#2a63d6;
 --shadow:0 1px 2px rgba(20,25,50,.06),0 6px 18px rgba(20,25,50,.06);
 --f-display:"Bricolage Grotesque",ui-rounded,"Segoe UI",system-ui,sans-serif;
 --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
 --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#0d1020; --surface:#161a2f; --surface2:#20253f; --ink:#eef0fb; --muted:#9ba3c6; --line:#2a3052;
 --accent:#ff6842; --accent-ink:#1a0d08; --accent-soft:#3a1c14;
 --good:#33d6a0; --good-bg:#10362b; --bad:#ff5f6d; --bad-bg:#3b1820; --gold:#ffc63f; --gold-bg:#3a2e0e; --info:#7aa5ff;
 --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0d1020; --surface:#161a2f; --surface2:#20253f; --ink:#eef0fb; --muted:#9ba3c6; --line:#2a3052;
 --accent:#ff6842; --accent-ink:#1a0d08; --accent-soft:#3a1c14;
 --good:#33d6a0; --good-bg:#10362b; --bad:#ff5f6d; --bad-bg:#3b1820; --gold:#ffc63f; --gold-bg:#3a2e0e; --info:#7aa5ff;
 --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--info);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 110px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:10px;min-height:56px}
.top h1{font-size:20px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;padding:0 18px;width:100%}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--surface2);color:var(--ink)}
.btn:disabled{opacity:.45}
.btn.sm{min-height:42px;font-size:15px;width:auto}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface2);font-size:13px;font-weight:700;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .5s}
/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--accent)}
/* home */
.hero{border-radius:20px;padding:18px;background:var(--ink);color:var(--bg);display:grid;gap:14px;position:relative;overflow:hidden}
.hero .k{font-family:var(--f-display);font-weight:800;font-size:46px;line-height:1}
.hero .sub{opacity:.75;font-size:14px}
.hero .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero .stat{background:color-mix(in srgb,var(--bg) 10%,transparent);border-radius:12px;padding:10px}
.hero .stat b{font-family:var(--f-mono);font-size:20px;display:block}
.hero .stat span{font-size:12px;opacity:.75}
.ring{width:84px;height:84px;flex:none}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface2)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:118px;box-shadow:var(--shadow)}
.tile .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;color:#fff}
.tile .ic svg{width:22px;height:22px}
.tile b{font-family:var(--f-display);font-size:17px}
.tile span{font-size:13px;color:var(--muted);line-height:1.35}
.modrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.modrow:last-child{border-bottom:0}
.dot{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#fff;font-family:var(--f-mono);font-size:13px;font-weight:700}
.readiness{display:grid;gap:10px}
.scale{position:relative;height:14px;border-radius:99px;background:linear-gradient(90deg,var(--bad) 0 60%,var(--gold) 60% 70%,var(--good) 70% 100%);opacity:.9}
.scale .pin{position:absolute;top:-6px;width:4px;height:26px;border-radius:2px;background:var(--ink);transform:translateX(-50%);transition:left .6s}
.scale .pass{position:absolute;top:18px;transform:translateX(-50%);font-size:11px;font-weight:700;color:var(--muted)}
/* quiz */
.qhead{display:flex;align-items:center;gap:10px}
.qhead .bar{flex:1}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.qtext{font-size:19px;font-weight:700;white-space:pre-line;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;min-height:58px;font-size:16px;line-height:1.4;transition:transform .08s,border-color .15s,background .15s}
.opt:active{transform:scale(.985)}
.opt .lt{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700}
.opt.sel{border-color:var(--info)}
.opt.sel .lt{background:var(--info);color:#fff}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .lt{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.no .lt{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt .why{grid-column:2;font-size:14px;color:var(--muted);margin-top:4px}
.fb{border-radius:16px;padding:14px 16px;display:grid;gap:8px;animation:rise .25s ease-out}
.fb.ok{background:var(--good-bg);border:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
.fb.no{background:var(--bad-bg);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.fb h3{font-size:19px}
.fb.ok h3{color:var(--good)} .fb.no h3{color:var(--bad)}
.official{font-size:14px;border-left:3px solid var(--muted);padding-left:10px;color:var(--ink)}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .25s}
.combo{font-family:var(--f-mono);font-weight:700;color:var(--gold)}
.xpfloat{position:fixed;left:50%;top:40%;transform:translate(-50%,0);font-family:var(--f-display);font-weight:800;font-size:34px;color:var(--gold);pointer-events:none;z-index:30;animation:xpf 1s ease-out forwards;text-shadow:0 2px 10px rgba(0,0,0,.25)}
@keyframes xpf{0%{opacity:0;transform:translate(-50%,10px) scale(.8)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
.sticky-actions{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:grid;gap:8px;padding-top:8px}
/* mock grid */
.qgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.qgrid button{aspect-ratio:1;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:13px;font-weight:700;padding:0}
.qgrid button.a{background:var(--info);color:#fff;border-color:var(--info)}
.qgrid button.f{box-shadow:inset 0 0 0 2px var(--gold)}
.qgrid button.cur{outline:2px solid var(--ink);outline-offset:1px}
.qgrid button.ok{background:var(--good);color:#fff;border-color:var(--good)}
.qgrid button.no{background:var(--bad);color:#fff;border-color:var(--bad)}
.timer{font-family:var(--f-mono);font-weight:700;font-size:17px;padding:6px 10px;border-radius:10px;background:var(--surface2)}
.timer.warn{background:var(--bad-bg);color:var(--bad)}
/* driving mode */
.dpanel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dpanel div{border-radius:12px;padding:8px;text-align:center;background:var(--surface);border:1px solid var(--line)}
.dpanel b{display:block;font-family:var(--f-mono);font-size:22px}
.dpanel span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.dpanel .g b{color:var(--good)} .dpanel .r b{color:var(--bad)}
/* lesson */
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:12px;box-shadow:var(--shadow)}
.lcard h2{font-size:22px}
.lcard p{margin:0}
.lcard ul,.lcard ol{margin:0;padding-left:20px;display:grid;gap:6px}
.def{border-radius:12px;padding:12px 14px;background:var(--surface2);display:grid;gap:4px}
.def b{font-family:var(--f-display);font-size:17px}
.note{border-radius:12px;padding:12px 14px;background:var(--gold-bg);font-weight:700}
.fig{font-size:13px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.steps{display:grid;gap:6px;counter-reset:s;list-style:none;padding:0!important}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center;background:var(--surface2);border-radius:10px;padding:8px 10px}
.steps li::before{counter-increment:s;content:counter(s);width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--mc,var(--accent));color:#fff;font-family:var(--f-mono);font-weight:700;font-size:13px}
.tbl{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
.tbl table{border-collapse:collapse;font-size:14px;min-width:100%}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}
.tbl th{background:var(--surface2);font-weight:700;white-space:nowrap}
.tbl.wide table{min-width:640px}
.tbl td.E{color:var(--good);font-weight:700;text-align:center}.tbl td.S{color:var(--info);font-weight:700;text-align:center}
.bubble{display:grid;gap:4px;padding:12px 14px;border-radius:14px 14px 14px 4px;background:var(--surface2)}
.bubble b{font-size:13px;color:var(--mc,var(--accent))}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--surface2)}
.dots i.on{background:var(--mc,var(--accent))}
.lesson-item{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 0}
.lesson-item:last-child{border-bottom:0}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
/* drills */
.seq{display:grid;gap:8px}
.seqitem{text-align:left;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface);font-size:15px;line-height:1.35}
.seqitem.done{border-color:var(--good);background:var(--good-bg)}
.seqitem.no{border-color:var(--bad);background:var(--bad-bg)}
.seqnum{font-family:var(--f-mono);font-weight:700;color:var(--good);margin-right:6px}
.buckets{display:grid;gap:8px}
.flash{min-height:260px;border-radius:20px;padding:22px;display:grid;place-items:center;text-align:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);width:100%}
.flash .t{font-family:var(--f-display);font-size:26px;font-weight:800}
.flash .d{font-size:17px;line-height:1.5}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{border-radius:14px;padding:10px;text-align:center;background:var(--surface2);display:grid;gap:4px;justify-items:center;font-size:12px;line-height:1.25}
.badge .m{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:20px;color:var(--muted)}
.badge.on{background:var(--gold-bg)}
.badge.on .m{background:var(--gold);color:#fff}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,12,25,.55);display:grid;align-items:end;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .card{max-width:528px;margin:0 auto;width:100%}
textarea{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);padding:10px;font-family:var(--f-mono);font-size:12px}
select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;max-width:90vw;text-align:center;animation:rise .2s}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:60}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

:root[data-course="prince2"]{--accent:#0d8f7d;--accent-ink:#ffffff;--accent-soft:#d7f3ee}
@media (prefers-color-scheme: dark){:root[data-course="prince2"]:not([data-theme="light"]){--accent:#2fd3b8;--accent-ink:#04221d;--accent-soft:#0f3a33}}
:root[data-course="prince2"][data-theme="dark"]{--accent:#2fd3b8;--accent-ink:#04221d;--accent-soft:#0f3a33}
html{-webkit-text-size-adjust:100%}
.cswitch{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);padding:4px;border-radius:14px}
.cswitch button{border:0;background:transparent;border-radius:11px;padding:8px 12px;display:grid;text-align:left;color:var(--muted);min-height:52px}
.cswitch button b{font-family:var(--f-display);font-size:16px;line-height:1.2}
.cswitch button span{font-size:12px}
.cswitch button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.cswitch button[aria-selected="true"] b{color:var(--accent)}
.plan{display:grid;gap:8px}
.ptask{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:48px;width:100%}
.ptask .pt{flex:1;min-width:0;text-align:left;font-weight:700;font-size:15px;line-height:1.3}
.ptask .pchk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none}
.ptask .pchk svg{width:14px;height:14px}
.ptask.done{opacity:.62}
.ptask.done .pchk{background:var(--good);border-color:var(--good);color:#fff}
.ptask.done .pt{text-decoration:line-through;font-weight:400}
.live{border:2px solid var(--info);display:grid;gap:8px}
.ocard,.paper{text-align:left;display:grid;gap:4px;width:100%}
.rules{margin:0;padding-left:20px;display:grid;gap:6px}
.tipline{padding-left:12px;border-left:3px solid var(--accent);font-size:15px;line-height:1.45}
.mnhook{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--accent);line-height:1.25}
.mnhook.small{font-size:16px;margin-top:6px}
.mnlist{margin:0;padding-left:22px;display:grid;gap:4px}
.search{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.gl{padding:10px 0;border-bottom:1px solid var(--line)}
.gl:last-child{border-bottom:0}
.gtag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.websrc{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;margin-top:4px}
.ofb{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--gold-bg);color:var(--gold)}
.unsure{border:0}
.unsure[aria-pressed="true"]{background:var(--gold-bg);color:var(--gold)}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.tf{min-height:76px;font-size:20px}
.btn.tf.no{background:var(--bad);color:#fff}
.btn.tf.yes{background:var(--good);color:#fff}
.speedcard{min-height:220px;transition:background .15s,border-color .15s}
.speedcard.fbok{background:var(--good-bg);border-color:var(--good)}
.speedcard.fbno{background:var(--bad-bg);border-color:var(--bad)}
.wbnotes{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}
.wbnotes summary{font-weight:700;color:var(--accent);cursor:pointer;font-size:15px}
.wbnotes p{font-size:15px;line-height:1.55;margin:8px 0 0}
.slide{margin:10px 0 4px;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff;cursor:zoom-in}
.slide img{display:block;width:100%;height:auto}
